[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20

; Queue worker.
;
; QUEUE_CONNECTION=database, so every ShouldQueue notification (including
; App\Notifications\ResetPasswordNotification) is written to the `jobs` table
; and only runs if a worker consumes it. Without this program nothing was
; draining that table, so password-reset mails accumulated undelivered.
;
; Runs as www-data rather than root. It inherits the container environment
; (APP_KEY, DB_*, MAIL_*) directly, since those are injected by `docker run
; --env-file`; PHP-FPM's `clear_env = no` is only relevant to the FPM pool.
;
; --max-time recycles the worker hourly so long-lived runs do not accumulate
; stale state; supervisor restarts it via autorestart.
[program:queue-worker]
command=/usr/local/bin/php /var/www/html/artisan queue:work --sleep=1 --tries=3 --max-time=3600 --verbose
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
