server {
    listen 10000;
    server_name _;

    root /var/www/html/public;

    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        # Debian's bundled fastcgi_params ends with `fastcgi_param HTTP_HOST
        # $host;`. $host is the Host header with the PORT REMOVED, so PHP sees
        # HTTP_HOST=localhost instead of localhost:10000.
        #
        # Laravel derives Request::root() from HTTP_HOST, and asset() (which
        # @vite() calls via Vite::assetPath()) generates URLs from that request
        # root rather than from config('app.url'). The port is therefore dropped
        # and every generated asset URL becomes http://localhost/build/... ,
        # which the browser treats as a different origin and blocks under CORS.
        #
        # Rebuild the value from $host plus the port nginx actually listens on.
        # $server_port is server-controlled, not client-supplied, so this stays
        # safe (unlike $http_host, which forwards unvalidated client input).
        fastcgi_param HTTP_HOST $host:$server_port;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
