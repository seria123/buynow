; PHP-FPM pool override for the buynow container.
; Loaded after the image's default www.conf via /usr/local/etc/php-fpm.d/*.conf
;
; The critical directive is `clear_env = no`. PHP-FPM otherwise wipes the
; process environment for workers, so variables supplied by `docker run -e` /
; `env_file` (APP_KEY, DB_*, MAIL_*, MPESA_*) never reach Laravel's env()
; helper. The app then boots with an empty key and throws
; MissingAppKeyException, surfacing as HTTP 500 on every route.

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Forward container environment into the PHP process.
clear_env = no

; Surface PHP notices/warnings in `docker logs` instead of swallowing them.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 32M
